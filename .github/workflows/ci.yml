name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: python (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (with api/dev/cv extras)
        run: pip install -e ".[api,dev,cv]"
      - name: Lint
        run: ruff check src/jobcut tests dashboard
      - name: Test
        run: pytest -q

  web:
    name: web (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
