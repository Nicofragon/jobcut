[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobcut"
version = "0.1.0"
description = "A local, scored LinkedIn job pipeline — wake up to a ranked shortlist, not 200 tabs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "jobcut contributors" }]
keywords = ["jobs", "linkedin", "apify", "scoring", "job-search", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]

# Runtime deps. apify-client is pinned to the 3.x major: pull.py uses the typed
# API (Run.id, wait_for_finish(wait_duration=...)) that changed in 4.x.
dependencies = [
    "apify-client>=3,<4",
    "pandas>=2",
    "openpyxl>=3",
    "python-dotenv>=1",
]

[project.optional-dependencies]
# FastAPI bridge consumed by the Next.js console (jobcut.api).
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
# Optional CV import (PDF/DOCX text extraction). Plain text/markdown need no extra.
cv = ["pypdf>=4", "python-docx>=1"]
# Optional AI polish: CV → profile drafting (cv.py) + interview-round extraction
# (process.py). Scoring never needs this — see llm.py.
llm = ["openai>=1", "anthropic>=0.40"]
# Streamlit dashboard (dashboard/app.py).
dashboard = ["streamlit>=1.30"]
# Dev / test tooling.
dev = ["pytest>=7", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
jobcut = "jobcut.cli:main"

[project.urls]
Homepage = "https://github.com/Nicofragon/jobcut"
Issues = "https://github.com/Nicofragon/jobcut/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobcut = ["templates/*.md", "templates/*.json", "templates/searches/*.json", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pin the rule set instead of inheriting ruff's defaults: 0.16 widened them (isort,
# pyupgrade, …) and turned every CI run red on unchanged code, because the `dev` extra
# installs ruff unpinned. These four are what the codebase has always been linted with
# (ruff's pre-0.16 default) — a new release can't silently redefine the gate now.
select = ["E4", "E7", "E9", "F"]
# E702: allow the compact `score += x; reasons.append(...)` style used in the rubric.
ignore = ["E702"]
